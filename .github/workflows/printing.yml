name: Service printing
on:
  pull_request:
  push:
    branches: [feature/servicio-recibo-etiqueta-20261104]
jobs:
  printer-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --check service-print.js && node --check printer-settings.js
      - run: npm run test:print
